[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-space-agent"
version = "0.1.0"
description = "LangGraph-based intelligent architectural space design agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "langgraph>=0.4.0",
    "langchain-core>=0.3.0",
    "pydantic>=2.10.6",
    "uvicorn>=0.32.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
